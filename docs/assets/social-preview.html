<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 640px;
    background: #09090b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Geist", Arial, Helvetica, sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .badge {
    width: 108px;
    height: 108px;
    border-radius: 9999px;
    background: #fafafa;
    border: 1px solid rgba(0, 0, 0, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge img {
    width: 62px;
    height: 62px;
    object-fit: contain;
  }
  .word {
    font-weight: 700;
    font-size: 78px;
    letter-spacing: -0.02em;
    color: #fafafa;
    line-height: 1;
  }
  .tagline {
    font-weight: 400;
    font-size: 20px;
    letter-spacing: -0.005em;
    color: #a1a1aa;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <div class="badge">
        <img src="logo.png" alt="" />
      </div>
      <span class="word">EvidenceRAG</span>
    </div>
    <div class="tagline">Retrieves evidence, cites it, or refuses to answer</div>
  </div>
</body>
</html>
