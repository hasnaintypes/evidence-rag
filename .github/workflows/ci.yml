name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint (pyflakes rules only - see pyproject.toml)
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # Runs on every PR/push regardless of which files changed, unlike
        # eval.yml's path-filtered retrieval-quality harness - these are
        # correctness tests (auth, ownership/authz, chat-pipeline failure
        # paths), not a quality metric, and must gate every merge. No real
        # Gemini/Supabase credentials are used or needed - every test
        # mocks the Gemini/JWKS call sites and runs against an isolated
        # temp SQLite DB (see tests/conftest.py).
        run: pytest tests/ -v
        env:
          GEMINI_API_KEY: ci-placeholder-not-a-real-credential

  web-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck + build
        # `next build` is the correct way to typecheck a Next.js App Router
        # project - its generated route/layout prop types (e.g.
        # LayoutProps<"/">) only exist once Next has run, so a bare
        # `tsc --noEmit` reports false-positive "Cannot find name" errors.
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
